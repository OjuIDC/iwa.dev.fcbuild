name: test-fast
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_quality: ${{ steps.classify.outputs.run_quality }}
      run_unit_domain: ${{ steps.classify.outputs.run_unit_domain }}
      run_postgres_focused: ${{ steps.classify.outputs.run_postgres_focused }}
      run_docker_compose_focused: ${{ steps.classify.outputs.run_docker_compose_focused }}
      broad_coverage: ${{ steps.classify.outputs.broad_coverage }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      categories: ${{ steps.classify.outputs.categories }}
      selected_jobs: ${{ steps.classify.outputs.selected_jobs }}
      trusted_context: ${{ steps.classify.outputs.trusted_context }}
      can_publish_pages: ${{ steps.classify.outputs.can_publish_pages }}
      pages_security_decision: ${{ steps.classify.outputs.pages_security_decision }}
      browser_preview: ${{ steps.classify.outputs.browser_preview }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Classify changed files and evaluate trust context
        id: classify
        run: |
          python scripts/classify_ci_changes.py \
            --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}" \
            --head-ref "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --repository "${{ github.repository }}" \
            --head-repo "${{ github.event.pull_request.head.repo.full_name || github.repository }}" \
            --head-repo-fork "${{ github.event.pull_request.head.repo.fork || 'false' }}" \
            --enable-pages-var "${{ vars.FC27_ENABLE_PAGES_TEST_REPORTS || 'false' }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json-out .ci-reports/changes/classification.json

  quality:
    needs: [changes]
    if: needs.changes.outputs.run_quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FC27_PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Compile and static boundary gates
        run: |
          python -m compileall -q src scripts tests
          python scripts/check_matchpulse_boundary.py
      - name: Run quality and policy test group
        run: |
          mkdir -p .ci-reports/quality
          MODULES=$(python -c "from src.fc27_ci_test_groups import modules_for_fast_group; print(' '.join(modules_for_fast_group('quality')))")
          python -m pytest -o addopts="" -q -rs \
            --durations=10 \
            --junitxml=.ci-reports/quality/raw-junit.xml \
            --html=.ci-reports/quality/raw-report.html --self-contained-html \
            $MODULES
      - name: Build and sanitize quality test report
        if: always()
        run: |
          python scripts/build_test_report.py \
            --junit-in .ci-reports/quality/raw-junit.xml \
            --raw-html-in .ci-reports/quality/raw-report.html \
            --junit-out .ci-reports/quality/out/test-results/junit.xml \
            --html-out .ci-reports/quality/out/test-report/index.html \
            --summary-out .ci-reports/quality/out/job-summary.md \
            --durations-out .ci-reports/quality/out/test-results/durations.json \
            --meta-out .ci-reports/quality/out/job-meta.json \
            --workflow "test-fast" \
            --test-group "quality" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number || 'N/A' }}" \
            --python-version "3.11" \
            --postgres-version "N/A" \
            --artifact-name "report-fast-quality" \
            --browser-preview "${{ needs.changes.outputs.browser_preview }}" \
            --pages-security-decision "${{ needs.changes.outputs.pages_security_decision }}" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/quality/out
      - name: Upload quality report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-fast-quality
          path: .ci-reports/quality/out/
          retention-days: 7

  unit-domain:
    needs: [changes]
    if: needs.changes.outputs.run_unit_domain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FC27_PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Run parallel-safe and serial unit-domain tests
        run: |
          mkdir -p .ci-reports/unit-domain
          PAR_MODULES=$(python -c "from src.fc27_ci_test_groups import modules_for_maintained_group; print(' '.join(modules_for_maintained_group('unit_domain_parallel')))")
          SER_MODULES=$(python -c "from src.fc27_ci_test_groups import modules_for_maintained_group; print(' '.join(modules_for_maintained_group('unit_domain_serial')))")
          rc=0
          python -m pytest -o addopts="" -q -rs -n auto --dist loadfile \
            --durations=10 \
            --junitxml=.ci-reports/unit-domain/junit-parallel.xml \
            --html=.ci-reports/unit-domain/raw-report.html --self-contained-html \
            $PAR_MODULES || rc=$?
          python -m pytest -o addopts="" -q -rs \
            --durations=10 \
            --junitxml=.ci-reports/unit-domain/junit-serial.xml \
            $SER_MODULES || rc=$?
          exit $rc
      - name: Build and sanitize unit-domain test report
        if: always()
        run: |
          python scripts/build_test_report.py \
            --junit-in .ci-reports/unit-domain/junit-parallel.xml .ci-reports/unit-domain/junit-serial.xml \
            --raw-html-in .ci-reports/unit-domain/raw-report.html \
            --junit-out .ci-reports/unit-domain/out/test-results/junit.xml \
            --html-out .ci-reports/unit-domain/out/test-report/index.html \
            --summary-out .ci-reports/unit-domain/out/job-summary.md \
            --durations-out .ci-reports/unit-domain/out/test-results/durations.json \
            --meta-out .ci-reports/unit-domain/out/job-meta.json \
            --workflow "test-fast" \
            --test-group "unit-domain" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number || 'N/A' }}" \
            --python-version "3.11" \
            --postgres-version "N/A" \
            --artifact-name "report-fast-unit-domain" \
            --browser-preview "${{ needs.changes.outputs.browser_preview }}" \
            --pages-security-decision "${{ needs.changes.outputs.pages_security_decision }}" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/unit-domain/out
      - name: Upload unit-domain report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-fast-unit-domain
          path: .ci-reports/unit-domain/out/
          retention-days: 7

  postgres-focused:
    needs: [changes]
    if: needs.changes.outputs.run_postgres_focused == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: fc27test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1024m
          --health-cmd "pg_isready -U fc27test" --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URI: postgresql://fc27test@127.0.0.1:55432/postgres
      TEST_POSTGRES_ADMIN_URI: postgresql://fc27test@127.0.0.1:55432/postgres
      FC27_PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Run focused PostgreSQL integration tests
        run: |
          mkdir -p .ci-reports/postgres-focused
          python -c "from src.db_roles import bootstrap_cluster; bootstrap_cluster('postgresql://fc27test@127.0.0.1:55432/postgres', {'fc27_migrator': None, 'fc27_app': None, 'fc27_dispatch': None, 'fc27_relay': None})"
          MODULES=$(python -c "from src.fc27_ci_test_groups import modules_for_fast_group; print(' '.join(modules_for_fast_group('postgres-focused')))")
          python -m pytest -o addopts="" -q -rs \
            --durations=10 \
            --junitxml=.ci-reports/postgres-focused/raw-junit.xml \
            --html=.ci-reports/postgres-focused/raw-report.html --self-contained-html \
            $MODULES
      - name: Build and sanitize postgres-focused test report
        if: always()
        run: |
          python scripts/build_test_report.py \
            --junit-in .ci-reports/postgres-focused/raw-junit.xml \
            --raw-html-in .ci-reports/postgres-focused/raw-report.html \
            --junit-out .ci-reports/postgres-focused/out/test-results/junit.xml \
            --html-out .ci-reports/postgres-focused/out/test-report/index.html \
            --summary-out .ci-reports/postgres-focused/out/job-summary.md \
            --durations-out .ci-reports/postgres-focused/out/test-results/durations.json \
            --meta-out .ci-reports/postgres-focused/out/job-meta.json \
            --workflow "test-fast" \
            --test-group "postgres-focused" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number || 'N/A' }}" \
            --python-version "3.11" \
            --postgres-version "16.15" \
            --artifact-name "report-fast-postgres-focused" \
            --browser-preview "${{ needs.changes.outputs.browser_preview }}" \
            --pages-security-decision "${{ needs.changes.outputs.pages_security_decision }}" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/postgres-focused/out
      - name: Upload postgres-focused report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-fast-postgres-focused
          path: .ci-reports/postgres-focused/out/
          retention-days: 7

  docker-compose-focused:
    needs: [changes]
    if: needs.changes.outputs.run_docker_compose_focused == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      COMPOSE_PROJECT_NAME: fc27-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FC27_PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Validate Compose profiles and isolation contracts
        run: |
          mkdir -p .ci-reports/docker-compose-focused
          sed -E 's/=replace_with_[A-Za-z0-9_-]+/=placeholder_ci_only_0123456789abcdef0123456789abcdef/' config.example.env > /tmp/ci.env
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file /tmp/ci.env config --quiet
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.community-worker.yml -f docker-compose.discord.yml -f docker-compose.ghcr.yml --profile fc27-polling --profile fc27-discord config --quiet
          python -m pytest -o addopts="" -q -rs \
            --durations=10 \
            --junitxml=.ci-reports/docker-compose-focused/raw-junit.xml \
            --html=.ci-reports/docker-compose-focused/raw-report.html --self-contained-html \
            tests/test_compose_isolation.py
      - name: Clean up isolated Compose project state
        if: always()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down -v --remove-orphans || true
          rm -f /tmp/ci.env
      - name: Build and sanitize docker-compose-focused test report
        if: always()
        run: |
          python scripts/build_test_report.py \
            --junit-in .ci-reports/docker-compose-focused/raw-junit.xml \
            --raw-html-in .ci-reports/docker-compose-focused/raw-report.html \
            --junit-out .ci-reports/docker-compose-focused/out/test-results/junit.xml \
            --html-out .ci-reports/docker-compose-focused/out/test-report/index.html \
            --summary-out .ci-reports/docker-compose-focused/out/job-summary.md \
            --durations-out .ci-reports/docker-compose-focused/out/test-results/durations.json \
            --meta-out .ci-reports/docker-compose-focused/out/job-meta.json \
            --workflow "test-fast" \
            --test-group "docker-compose-focused" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number || 'N/A' }}" \
            --python-version "3.11" \
            --postgres-version "N/A" \
            --artifact-name "report-fast-docker-compose-focused" \
            --browser-preview "${{ needs.changes.outputs.browser_preview }}" \
            --pages-security-decision "${{ needs.changes.outputs.pages_security_decision }}" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/docker-compose-focused/out
      - name: Upload docker-compose-focused report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-fast-docker-compose-focused
          path: .ci-reports/docker-compose-focused/out/
          retention-days: 7

  aggregate-report:
    needs: [changes, quality, unit-domain, postgres-focused, docker-compose-focused]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download fast workflow shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-fast-*
          path: .ci-reports/downloaded
      - name: Aggregate, reconcile, and sanitize browser reports
        run: |
          python scripts/aggregate_test_reports.py \
            --input-dirs .ci-reports/downloaded \
            --out-dir .ci-reports/aggregate \
            --workflow "test-fast" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number || 'N/A' }}" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --python-version "3.11" \
            --postgres-version "16.15" \
            --browser-preview "${{ needs.changes.outputs.browser_preview }}" \
            --pages-security-decision "${{ needs.changes.outputs.pages_security_decision }}" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/aggregate
      - name: Upload unified fast browser test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-fast-browser-report
          path: |
            .ci-reports/aggregate/test-report/
            .ci-reports/aggregate/test-results/
            .ci-reports/aggregate/job-summary.md
            .ci-reports/aggregate/aggregate-meta.json
          retention-days: 7
      - name: Upload Pages artifact when safely approved in trusted context
        if: needs.changes.outputs.can_publish_pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .ci-reports/aggregate/pages-site

  publish-pages:
    needs: [changes, aggregate-report]
    if: needs.changes.outputs.can_publish_pages == 'true' && needs.aggregate-report.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy sanitized static report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  result:
    needs: [changes, quality, unit-domain, postgres-focused, docker-compose-focused, aggregate-report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce fail-closed fast workflow gate
        env:
          RUN_QUALITY: ${{ needs.changes.outputs.run_quality }}
          RES_QUALITY: ${{ needs.quality.result }}
          RUN_UNIT: ${{ needs.changes.outputs.run_unit_domain }}
          RES_UNIT: ${{ needs.unit-domain.result }}
          RUN_PG: ${{ needs.changes.outputs.run_postgres_focused }}
          RES_PG: ${{ needs.postgres-focused.result }}
          RUN_COMPOSE: ${{ needs.changes.outputs.run_docker_compose_focused }}
          RES_COMPOSE: ${{ needs.docker-compose-focused.result }}
          RES_AGG: ${{ needs.aggregate-report.result }}
        run: |
          python - <<'PY'
          import os, sys
          checks = [
              ("quality", os.environ.get("RUN_QUALITY"), os.environ.get("RES_QUALITY")),
              ("unit-domain", os.environ.get("RUN_UNIT"), os.environ.get("RES_UNIT")),
              ("postgres-focused", os.environ.get("RUN_PG"), os.environ.get("RES_PG")),
              ("docker-compose-focused", os.environ.get("RUN_COMPOSE"), os.environ.get("RES_COMPOSE")),
              ("aggregate-report", "true", os.environ.get("RES_AGG")),
          ]
          failed = []
          for name, should_run, result in checks:
              if should_run == "true" and result != "success":
                  failed.append(f"{name}={result}")
              elif should_run == "false" and result not in ("skipped", "success"):
                  failed.append(f"{name}={result} (expected skipped)")
          if failed:
              print("FAST_WORKFLOW_GATE=FAIL: " + ", ".join(failed))
              sys.exit(1)
          print("FAST_WORKFLOW_GATE=PASS")
          PY
