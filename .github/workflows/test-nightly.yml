name: test-nightly
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: fc27test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1024m
          --health-cmd "pg_isready -U fc27test" --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URI: postgresql://fc27test@127.0.0.1:55432/postgres
      COMPOSE_PROJECT_NAME: fc27-nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Compile and static boundary gates
        run: |
          python -m compileall -q src scripts tests
          python scripts/check_documentation_consistency.py --check --strict
          python scripts/check_matchpulse_boundary.py
      - name: Repeat runs of parallel-safe suite under pytest-xdist
        run: |
          PAR_MODULES=$(python -c "from src.fc27_ci_test_groups import modules_for_maintained_group; print(' '.join(modules_for_maintained_group('unit_domain_parallel')))")
          for iter in 1 2 3; do
            echo "Running xdist parallel stability iteration $iter..."
            python -m pytest -o addopts="" -q -n auto --dist loadfile $PAR_MODULES
          done
      - name: Performance, backup-restore, and report-sanitization regression suites
        run: |
          python -m pytest -o addopts="" -q tests/test_fc27_performance.py tests/test_fc27_backup_restore.py tests/test_ci_report_sanitization.py tests/test_github_workflows.py
      - name: Container-build and Compose isolation verification
        run: |
          sed -E 's/=replace_with_[A-Za-z0-9_-]+/=placeholder_ci_only_0123456789abcdef0123456789abcdef/' config.example.env > /tmp/ci.env
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file /tmp/ci.env config --quiet
          docker build -f Dockerfile.community-worker -t fc27-nightly-community-worker:ci .
          docker build -f Dockerfile.discord -t fc27-nightly-discord:ci .
      - name: Clean up isolated Compose state
        if: always()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down -v --remove-orphans || true
          rm -f /tmp/ci.env
      - name: Run complete repository test suite
        run: |
          mkdir -p .ci-reports/nightly
          python -c "from src.db_roles import bootstrap_cluster; bootstrap_cluster('postgresql://fc27test@127.0.0.1:55432/postgres', {'fc27_migrator': None, 'fc27_app': None, 'fc27_dispatch': None, 'fc27_relay': None})"
          NON_SERIAL=$(python -c "from src.fc27_ci_test_groups import modules_for_maintained_group; print(' '.join(modules_for_maintained_group('quality') + modules_for_maintained_group('unit_domain_parallel') + modules_for_maintained_group('postgres_parallel_safe')))")
          SERIAL_ALL=$(python -c "from src.fc27_ci_test_groups import modules_for_maintained_group; print(' '.join(modules_for_maintained_group('unit_domain_serial') + modules_for_maintained_group('postgres_serial') + modules_for_maintained_group('compose_serial')))")
          rc=0
          python -m pytest -o addopts="" -q -rs -n 4 --dist loadfile \
            --durations=10 \
            --junitxml=.ci-reports/nightly/junit-parallel.xml \
            --html=.ci-reports/nightly/raw-report.html --self-contained-html \
            $NON_SERIAL || rc=$?
          python -m pytest -o addopts="" -q -rs \
            --durations=10 \
            --junitxml=.ci-reports/nightly/junit-serial.xml \
            $SERIAL_ALL || rc=$?
          exit $rc
      - name: Build, aggregate, and sanitize nightly browser report
        if: always()
        run: |
          python scripts/build_test_report.py \
            --junit-in .ci-reports/nightly/junit-parallel.xml .ci-reports/nightly/junit-serial.xml \
            --raw-html-in .ci-reports/nightly/raw-report.html \
            --junit-out .ci-reports/nightly/out/test-results/junit.xml \
            --html-out .ci-reports/nightly/out/test-report/index.html \
            --summary-out .ci-reports/nightly/out/job-summary.md \
            --durations-out .ci-reports/nightly/out/test-results/durations.json \
            --meta-out .ci-reports/nightly/out/job-meta.json \
            --workflow "test-nightly" \
            --test-group "nightly-regression" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "N/A" \
            --python-version "3.11" \
            --postgres-version "16.15" \
            --artifact-name "test-nightly-browser-report" \
            --browser-preview "JOB_SUMMARY_ONLY" \
            --pages-security-decision "NOT_APPROVED_USE_JOB_SUMMARY_ONLY"
          python scripts/aggregate_test_reports.py \
            --input-dirs .ci-reports/nightly/out \
            --out-dir .ci-reports/nightly/aggregate \
            --workflow "test-nightly" \
            --commit-sha "${{ github.sha }}" \
            --pr-number "N/A" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --python-version "3.11" \
            --postgres-version "16.15" \
            --browser-preview "JOB_SUMMARY_ONLY" \
            --pages-security-decision "NOT_APPROVED_USE_JOB_SUMMARY_ONLY" \
            --append-github-step-summary
          python scripts/sanitize_test_report.py .ci-reports/nightly/aggregate
      - name: Upload nightly browser report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-nightly-browser-report
          path: |
            .ci-reports/nightly/aggregate/test-report/
            .ci-reports/nightly/aggregate/test-results/
            .ci-reports/nightly/aggregate/job-summary.md
            .ci-reports/nightly/aggregate/aggregate-meta.json
          retention-days: 7
