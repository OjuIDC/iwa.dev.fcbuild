name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: fc27test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U fc27test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URI: postgresql://fc27test@127.0.0.1:55432/postgres
      SWARMS_TELEMETRY_ON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System packages (real espeak-ng/tesseract for TTS and OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng tesseract-ocr
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-swarms.txt -r requirements-langfuse.txt
          pip check
      - name: Compile
        run: python -m compileall -q src tests host_agent voice
      - name: Test
        run: python -m pytest -o addopts="" -q -rs
      - name: Compose config (all profiles)
        run: |
          sed -E 's/=replace_with_[A-Za-z0-9_-]+/=placeholder_ci_only_0123456789abcdef0123456789abcdef/' config.example.env > /tmp/ci.env
          docker compose --env-file /tmp/ci.env config --quiet
          docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
          docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file /tmp/ci.env --profile voice --profile rtsp config --quiet
          docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.langfuse.yml --profile langfuse config --quiet
