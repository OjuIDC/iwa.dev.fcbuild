[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fc27-model-routing"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
