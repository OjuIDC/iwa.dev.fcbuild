services:
  fc27-community-client-evaluation:
    build:
      context: .
      dockerfile: Dockerfile.community-eval
    image: fc27/community-client-evaluation:local
    user: "10001:65534"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 10s
    environment:
      PYTHONUNBUFFERED: "1"
      FC27_COMMUNITY_PROVIDER_ENABLED: ${FC27_COMMUNITY_PROVIDER_ENABLED:-false}
      FC27_PERSISTENCE_ENABLED: "false"
      FC27_RECOMMENDATIONS_ENABLED: "false"
      DISPATCH_ENABLED: "false"
    networks:
      - fc27_community_eval_net

networks:
  fc27_community_eval_net:
    driver: bridge
