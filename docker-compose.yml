name: fc27-full-stack

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  stt_cache:

networks:
  # Shared application network (Redis event bus, MCP, Ollama, Graph API).
  fc27_net:
    driver: bridge
  # Internal PostgreSQL data network (fc27_data). Bounded database-role services
  # join this network: postgres, db-bootstrap, db-migrate, graph-api, outbox-relay,
  # and dispatch-worker (plus optional overlays fc27-community-worker and
  # fc27-discord-bot when their profiles are explicitly enabled).
  fc27_data:
    driver: bridge
    internal: true

# Non-secret settings shared by application services. Deliberately contains NO
# approval/commissioner/signing secrets or database URIs: approval signing secrets
# are given only to graph-api, and database URIs are mounted as per-service files.
x-common: &common
  FC27_CLUB_ID: ${FC27_CLUB_ID:-330323}
  FC_PLATFORM: ${FC_PLATFORM:-common-gen5}
  FC27_MCP_URL: http://fc27-mcp:8000
  GRAPH_URL: http://graph-api:8001
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

x-runtime-controls: &runtime-controls
  pids_limit: ${FC27_DEFAULT_PIDS_LIMIT:-256}
  stop_grace_period: ${FC27_DEFAULT_STOP_GRACE_PERIOD:-30s}
  logging:
    driver: json-file
    options:
      max-size: ${FC27_LOG_MAX_SIZE:-10m}
      max-file: "${FC27_LOG_MAX_FILE:-3}"

services:
  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    # Fixed program + arguments live in the entrypoint so that the documented
    # `docker compose --profile bootstrap run --rm db-bootstrap --confirm`
    # APPENDS --confirm instead of replacing the command. With no extra
    # arguments the tool runs a non-mutating dry run (plan only).
    entrypoint: ["python", "-m", "src.db_roles", "bootstrap", "--database", "fc27", "--legacy-owner", "fc27"]
    environment:
      POSTGRES_ADMIN_URI_FILE: /run/secrets/postgres_admin_uri
      FC27_MIGRATOR_PASSWORD_FILE: /run/secrets/fc27_migrator_password
      FC27_APP_PASSWORD_FILE: /run/secrets/fc27_app_password
      FC27_DISPATCH_PASSWORD_FILE: /run/secrets/fc27_dispatch_password
      FC27_RELAY_PASSWORD_FILE: /run/secrets/fc27_relay_password
    secrets:
      - postgres_admin_uri
      - fc27_migrator_password
      - fc27_app_password
      - fc27_dispatch_password
      - fc27_relay_password
    networks: [fc27_data]
    profiles: [bootstrap]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.db_migrate"]
    environment:
      POSTGRES_URI_FILE: /run/secrets/fc27_migrator_uri
    secrets:
      - fc27_migrator_uri
    networks: [fc27_data]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *runtime-controls
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}
    environment:
      POSTGRES_DB: fc27
      POSTGRES_USER: fc27
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [fc27_data]
    mem_limit: ${FC27_POSTGRES_MEM_LIMIT:-1g}
    cpus: ${FC27_POSTGRES_CPUS:-1.50}
    pids_limit: ${FC27_POSTGRES_PIDS_LIMIT:-128}
    stop_grace_period: ${FC27_POSTGRES_STOP_GRACE_PERIOD:-90s}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc27 -d fc27"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    <<: *runtime-controls
    image: ${REDIS_IMAGE:-redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks: [fc27_net]
    mem_limit: ${FC27_REDIS_MEM_LIMIT:-512m}
    cpus: ${FC27_REDIS_CPUS:-1.00}
    pids_limit: ${FC27_REDIS_PIDS_LIMIT:-128}
    stop_grace_period: ${FC27_REDIS_STOP_GRACE_PERIOD:-45s}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Model inference runs on the shared lab Ollama server (OLLAMA_BASE_URL,
  # default http://araba.ojuidc.olutech.systems:11434). The bundled Ollama
  # container is NOT started by default; it starts only with
  # `--profile local-ollama` (then also set OLLAMA_BASE_URL=http://ollama:11434).
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429}
    profiles: [local-ollama]
    volumes:
      - ollama_data:/root/.ollama
    networks: [fc27_net]
    expose: ["11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-64}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429}
    profiles: [local-ollama]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [fc27_net]
    environment:
      OLLAMA_HOST: http://ollama:11434
      REQUIRED_MODELS: ${REQUIRED_MODELS:-llama3.2:3b qwen2.5:7b}
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  model-health:
    image: ${PYTHON_IMAGE:-python:3.15.0-slim@sha256:f5b92f2a669a4c347044f29367f31983280b648250ca94dea66f98c53bc87e58}
    <<: *app-security
    # No dependency on ollama-init: the default model server is remote and
    # models are provisioned there. The watcher retries every 30 s, so with
    # --profile local-ollama it turns healthy once ollama-init has pulled them.
    networks: [fc27_net]
    environment:
      OLLAMA_URL: ${OLLAMA_BASE_URL:-http://araba.ojuidc.olutech.systems:11434}
      REQUIRED_MODELS: ${REQUIRED_MODELS:-llama3.2:3b qwen2.5:7b}
    volumes:
      - ./scripts/model_health.py:/app/model_health.py:ro
    command: ["python", "/app/model_health.py", "--watch"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/models-healthy"]
      interval: 20s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    restart: unless-stopped

  fc27-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    <<: *app-security
    environment:
      FC27_CLUB_ID: ${FC27_CLUB_ID:-330323}
      FC_PLATFORM: ${FC_PLATFORM:-common-gen5}
      MCP_PORT: "8000"
      # Listen on all interfaces INSIDE the container so Compose peers
      # (graph-api, live-watcher, post-match-rundown) can reach it. The port is
      # NOT published to the host; bearer auth stays mandatory.
      MCP_HOST: "0.0.0.0"
      MCP_ALLOWED_ORIGIN: ${MCP_ALLOWED_ORIGIN:-http://localhost}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN in .env}
    networks: [fc27_net]
    expose: ["8000"]
    healthcheck:
      # Probes the container's own Compose-network address (never loopback), i.e.
      # the same listener peers use. Fails if MCP is bound to 127.0.0.1.
      test: ["CMD", "python", "-m", "src.mcp_healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  graph-api:
    build:
      context: .
      dockerfile: Dockerfile.graph
      args:
        WITH_SWARMS: "true"
        WITH_LANGFUSE: "true"
    <<: *app-security
    command: ["uvicorn", "src.graph_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *common
      # Only graph-api receives database access and approval-verification material.
      POSTGRES_URI_FILE: /run/secrets/fc27_app_uri
      GRAPH_RUN_MIGRATIONS: "false"
      GRAPH_CHECKPOINT_SETUP: "false"
      DISPATCH_ENABLED: "false"
      APPROVAL_REQUEST_TTL_HOURS: ${APPROVAL_REQUEST_TTL_HOURS:-72}
      APPROVAL_CLI_HMAC_ENABLED: ${APPROVAL_CLI_HMAC_ENABLED:-true}
      FC27_CODE_REVISION: ${FC27_CODE_REVISION:-}
      FC27_DEPLOYMENT_ID: ${FC27_DEPLOYMENT_ID:-}
      GRAPH_SERVICE_TOKEN: ${GRAPH_SERVICE_TOKEN:?Set GRAPH_SERVICE_TOKEN in .env}
      GRAPH_COMMISSIONER_TOKEN_SHA256: ${GRAPH_COMMISSIONER_TOKEN_SHA256:?Set GRAPH_COMMISSIONER_TOKEN_SHA256 in .env}
      COMMISSIONER_ID: ${COMMISSIONER_ID:?Set COMMISSIONER_ID in .env}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?Set APPROVAL_SIGNING_SECRET in .env}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-120}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN in .env}
      MODEL_CATALOG: /app/config/model_catalog.json
      MODEL_BENCHMARK_MATRIX: /app/config/role_benchmark_matrix.json
      MODEL_BENCHMARK_RESULTS: /app/reports/model_benchmark_results.json
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://araba.ojuidc.olutech.systems:11434}
      LM_STUDIO_FALLBACK_ENABLED: ${LM_STUDIO_FALLBACK_ENABLED:-false}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      ROLE_BACKEND: ${ROLE_BACKEND:-swarms}
      SWARMS_TELEMETRY_ON: "false"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGFUSE_ENABLED: "false"
      # Phase 2 identity secrets: file-based, mounted into graph-api ONLY.
      # BFF_SERVICE_TOKEN authenticates the BFF; it must differ from GRAPH_SERVICE_TOKEN.
      BFF_SERVICE_TOKEN_FILE: /run/secrets/bff_service_token
      # Fernet key (44-char urlsafe base64) for TOTP seed encryption at rest.
      IDENTITY_ENCRYPTION_KEY_FILE: /run/secrets/identity_encryption_key
      # One-time commissioner bootstrap secret. There is NO fallback: if this file
      # is empty/placeholder/weak, bootstrap is disabled (fail closed).
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    secrets:
      - fc27_app_uri
      - bff_service_token
      - identity_encryption_key
      - bootstrap_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./reports:/app/reports:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fc27-mcp:
        condition: service_healthy
      model-health:
        condition: service_healthy
    networks: [fc27_net, fc27_data]
    ports:
      - "127.0.0.1:${GRAPH_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  live-watcher:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.live_match_watcher"]
    environment:
      <<: *common
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      TILT_THRESHOLD: ${TILT_THRESHOLD:-3}
      GRAPH_SERVICE_TOKEN: ${GRAPH_SERVICE_TOKEN:?Set GRAPH_SERVICE_TOKEN in .env}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN in .env}
    depends_on:
      graph-api:
        condition: service_healthy
    networks: [fc27_net]
    restart: unless-stopped

  post-match-rundown:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.post_match_rundown"]
    environment:
      <<: *common
      COMMISSIONER_ID: ${COMMISSIONER_ID:?Set COMMISSIONER_ID in .env}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN in .env}
    depends_on:
      redis:
        condition: service_healthy
      fc27-mcp:
        condition: service_healthy
    networks: [fc27_net]
    restart: unless-stopped

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.dispatch.outbox_relay"]
    environment:
      <<: *common
      POSTGRES_URI_FILE: /run/secrets/fc27_relay_uri
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-50}
      OUTBOX_RELAY_POLL_INTERVAL: ${OUTBOX_RELAY_POLL_INTERVAL:-1.0}
    secrets:
      - fc27_relay_uri
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [fc27_net, fc27_data]
    restart: unless-stopped

  dispatch-worker:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.dispatch.worker"]
    environment:
      <<: *common
      POSTGRES_URI_FILE: /run/secrets/fc27_dispatch_uri
      DISPATCH_ENABLED: ${DISPATCH_ENABLED:-false}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15.0}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1.0}
    secrets:
      - fc27_dispatch_uri
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "src.dispatch.worker", "--health-check"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 15s
    networks: [fc27_net, fc27_data]
    restart: unless-stopped

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.live_ws_server"]
    environment:
      <<: *common
      WS_HOST: 0.0.0.0
      WS_PORT: "8765"
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:?Set WS_AUTH_TOKEN in .env}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      redis:
        condition: service_healthy
    networks: [fc27_net]
    ports:
      - "127.0.0.1:${WS_HOST_PORT:-8765}:8765"
      - "127.0.0.1:${WS_HEALTH_HOST_PORT:-8766}:8766"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8766/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rtsp-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.graph
    <<: *app-security
    command: ["python", "-m", "src.rtsp_frame_analyzer"]
    environment:
      <<: *common
      XBOX_IP: ${XBOX_IP:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [fc27_net]
    profiles: [rtsp]
    restart: unless-stopped

  stt:
    <<: *app-security
    build: {context: ., dockerfile: Dockerfile.stt}
    profiles: [voice]
    networks: [fc27_net]
    environment:
      STT_MODEL: ${STT_MODEL:-small.en}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
    # The image runs as user "voice" with HOME=/home/voice; the model cache must live there.
    volumes: [stt_cache:/home/voice/.cache]
    expose: ["9001"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"], interval: 30s, timeout: 10s, retries: 10, start_period: 300s}
    restart: unless-stopped
  tts:
    <<: *app-security
    build: {context: ., dockerfile: Dockerfile.tts}
    profiles: [voice]
    networks: [fc27_net]
    expose: ["9002"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"], interval: 20s, timeout: 5s, retries: 5}
    restart: unless-stopped
  voice-gateway:
    <<: *app-security
    build: {context: ., dockerfile: Dockerfile.graph}
    command: ["uvicorn", "src.voice_gateway:app", "--host", "0.0.0.0", "--port", "9000"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"], interval: 20s, timeout: 5s, retries: 5}
    profiles: [voice]
    networks: [fc27_net]
    environment:
      GRAPH_URL: http://graph-api:8001
      # Read-only service role. Voice holds no commissioner or signing material.
      GRAPH_SERVICE_TOKEN: ${GRAPH_SERVICE_TOKEN:?Set GRAPH_SERVICE_TOKEN}
      VOICE_API_TOKEN: ${VOICE_API_TOKEN:?Set VOICE_API_TOKEN}
      STT_URL: http://stt:9001
      TTS_URL: http://tts:9002
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      graph-api: {condition: service_healthy}
      stt: {condition: service_healthy}
      tts: {condition: service_healthy}
    ports: ["127.0.0.1:${VOICE_HOST_PORT:-9000}:9000"]
    restart: unless-stopped

secrets:
  postgres_admin_uri:
    file: ./secrets/postgres_admin_uri
  fc27_migrator_password:
    file: ./secrets/fc27_migrator_password
  fc27_app_password:
    file: ./secrets/fc27_app_password
  fc27_dispatch_password:
    file: ./secrets/fc27_dispatch_password
  fc27_migrator_uri:
    file: ./secrets/fc27_migrator_uri
  fc27_app_uri:
    file: ./secrets/fc27_app_uri
  bff_service_token:
    file: ./secrets/bff_service_token
  identity_encryption_key:
    file: ./secrets/identity_encryption_key
  bootstrap_token:
    file: ./secrets/bootstrap_token
  fc27_relay_password:
    file: ./secrets/fc27_relay_password
  fc27_relay_uri:
    file: ./secrets/fc27_relay_uri
  fc27_dispatch_uri:
    file: ./secrets/fc27_dispatch_uri
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
